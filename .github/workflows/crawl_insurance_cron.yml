name: Automated Insurance Products Crawler Cron

on:
  schedule:
    # Runs every night at 18:00 UTC (02:00 AM Taiwan Time UTC+8)
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI anytime

jobs:
  trigger_crawler:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Trigger Supabase Crawler Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRAWLER_CRON_SECRET: ${{ secrets.CRAWLER_CRON_SECRET }}
        run: |
          echo "Triggering crawl-insurance-products Edge Function..."
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRAWLER_CRON_SECRET" ]; then
            echo "❌ Error: SUPABASE_URL or CRAWLER_CRON_SECRET is not set in GitHub Secrets!"
            exit 1
          fi
          
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${SUPABASE_URL}/functions/v1/crawl-insurance-products" \
            -H "Content-Type: application/json" \
            -H "x-crawler-secret: ${CRAWLER_CRON_SECRET}")
          
          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Response Code: $http_code"
          echo "Response Body: $body"
          
          if [ "$http_code" -ne 200 ]; then
            echo "❌ Crawler failed with HTTP $http_code"
            exit 1
          fi
          echo "✅ Crawler executed successfully!"
